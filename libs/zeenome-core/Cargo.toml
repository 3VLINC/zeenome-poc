[package]
name = "zeenome-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
default = []
sp1 = ["sp1-zkvm"]

[dependencies]
# Core serialization (always needed)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_canonicalizer = "0.3.2"

# Crypto (always needed)
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core"] }
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4.3"
rand = "0.8"
rand_core = "0.6"
base64 = "0.21"

# Error handling (always needed)
thiserror = "1.0"
anyhow = "1.0"

# Serialization (always needed)
bincode = "1"

# Merkle trees (always needed)
rs_merkle = { version = "1.5.0", default-features = false }

# Merkle Mountain Range — Nervos CKB implementation. `default-features = false`
# is required because the crate's default feature pulls in `std`, but `mmr.rs`
# is compiled into every SP1 guest via `zk.rs` and the guest target is `no_std`.
ckb-merkle-mountain-range = { version = "0.6.1", default-features = false }

# SP1 support (optional, enabled with "sp1" feature)
sp1-zkvm = { version = "6.1.0", optional = true }

