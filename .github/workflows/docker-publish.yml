# Build and publish the zeenome-poc image to Docker Hub.
#
# Tags:
#   3vlinc/zeenome-poc:latest   3vlinc/zeenome-poc:<sha>
#   threevl/zeenome-poc:latest  threevl/zeenome-poc:<sha>   (secondary, same secrets)
#
# Required repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.
# Until those are set the workflow still runs but only builds (no push), so the
# first run after adding this file is green rather than a failed login.

name: Docker publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      push:
        description: "Push to Docker Hub after build"
        required: false
        default: true
        type: boolean

env:
  IMAGE_NAME: zeenome-poc
  PRIMARY_NAMESPACE: 3vlinc
  SECONDARY_NAMESPACE: threevl

jobs:
  build-and-push:
    name: Build and push zeenome-poc
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The image bundles the SP1 toolchain + a compiled guest ELF (~5 GB), and
      # the build needs headroom for cargo/BuildKit caches. Free the runner disk.
      - name: Reclaim runner disk space
        uses: data-intuitive/reclaim-the-bytes@v2
        with:
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-docker-images: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Decide tags and whether to push
        id: meta
        shell: bash
        env:
          HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Only push when creds exist AND (push to main OR dispatch with push=true).
          push="false"
          if [[ -n "${HAS_TOKEN}" ]]; then
            if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
              push="true"
            elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.push }}" == "true" ]]; then
              push="true"
            fi
          fi
          echo "push=${push}" >> "$GITHUB_OUTPUT"

          tags=()
          for ns in "${{ env.PRIMARY_NAMESPACE }}" "${{ env.SECONDARY_NAMESPACE }}"; do
            tags+=("${ns}/${{ env.IMAGE_NAME }}:latest")
            tags+=("${ns}/${{ env.IMAGE_NAME }}:${{ github.sha }}")
          done
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "push=${push}"
          echo "Tags:"; printf '  %s\n' "${tags[@]}"

      - name: Log in to Docker Hub
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/poc/Dockerfile
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
