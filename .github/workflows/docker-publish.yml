# Build and publish the zeenome-poc image to Docker Hub.
#
# Tags:
#   threevl/zeenome-poc:latest  threevl/zeenome-poc:<sha>
#   (optional secondary namespace via the SECONDARY_NAMESPACE variable, same token)
#
# Credentials live in the `dev` GitHub environment:
#   DOCKERHUB_USERNAME  -> environment variable  (vars.DOCKERHUB_USERNAME)
#   DOCKERHUB_TOKEN     -> environment secret     (secrets.DOCKERHUB_TOKEN)
# Until the token is set the workflow still runs but only builds (no push), so a
# run without credentials is green rather than a failed login.

name: Docker publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      push:
        description: "Push to Docker Hub after build"
        required: false
        default: true
        type: boolean

env:
  IMAGE_NAME: zeenome-poc
  PRIMARY_NAMESPACE: threevl
  # Optional extra Hub namespace (e.g. 3vlinc). Only set this if the same token
  # can also write there, else the push fails. Configure as repo/env variable
  # SECONDARY_NAMESPACE to enable; empty means push threevl only.
  SECONDARY_NAMESPACE: ${{ vars.SECONDARY_NAMESPACE }}

jobs:
  build-and-push:
    name: Build and push zeenome-poc
    runs-on: ubuntu-latest
    # DOCKERHUB_USERNAME (variable) and DOCKERHUB_TOKEN (secret) live in the `dev`
    # environment, so the job must opt into it to read them.
    environment: dev
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The image bundles the SP1 toolchain + a compiled guest ELF (~5 GB), and
      # the build needs headroom for cargo/BuildKit caches. Free the runner disk.
      - name: Reclaim runner disk space
        uses: data-intuitive/reclaim-the-bytes@v2
        with:
          remove-dotnet: true
          remove-android-sdk: true
          remove-haskell-ghc: true
          remove-docker-images: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Decide tags and whether to push
        id: meta
        shell: bash
        env:
          HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Only push when creds exist AND (push to main OR dispatch with push=true).
          push="false"
          if [[ -n "${HAS_TOKEN}" ]]; then
            if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
              push="true"
            elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.push }}" == "true" ]]; then
              push="true"
            fi
          fi
          echo "push=${push}" >> "$GITHUB_OUTPUT"

          tags=()
          for ns in "${{ env.PRIMARY_NAMESPACE }}" "${{ env.SECONDARY_NAMESPACE }}"; do
            [[ -z "${ns}" ]] && continue
            tags+=("${ns}/${{ env.IMAGE_NAME }}:latest")
            tags+=("${ns}/${{ env.IMAGE_NAME }}:${{ github.sha }}")
          done
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "push=${push}"
          echo "Tags:"; printf '  %s\n' "${tags[@]}"

      - name: Log in to Docker Hub
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/poc/Dockerfile
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
